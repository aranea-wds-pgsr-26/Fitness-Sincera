<!-- @dsCard group="Brand" viewport="700x160" name="Wordmark & logo" subtitle="Lowercase 'flux' with the lime Zap tile. Full name on auth screens." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; background: var(--shell-900); font-family: var(--font-body); padding: 0; }
  .wrap { display: flex; align-items: center; gap: 40px; padding: 30px 34px; }
  .lock { display: flex; align-items: center; gap: 10px; }
  .tile { width: 38px; height: 38px; background: var(--lime-400); border-radius: 11px; display: flex; align-items: center; justify-content: center; box-shadow: var(--glow-lime); }
  .tile svg { width: 22px; height: 22px; color: #000; fill: #000; }
  .wm { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: var(--tracking-tighter); }
  .full { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: var(--tracking-tighter); }
  .divider { width: 1px; height: 54px; background: rgba(255,255,255,.1); }
  .note { font-size: 11px; color: var(--slate-500); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lock">
      <div class="tile"><i data-lucide="zap"></i></div>
      <span class="wm">FS</span>
    </div>
    <div class="divider"></div>
    <div class="lock">
      <div class="tile" style="width:44px;height:44px;border-radius:13px"><i data-lucide="zap"></i></div>
      <span class="full">FITNESS SINCERA</span>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
