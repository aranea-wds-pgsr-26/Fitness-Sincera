<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals — Slate" subtitle="The text & UI ramp. Tailwind slate, top to bottom." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); }
  .wrap { display: flex; padding: 20px; gap: 6px; }
  .sw { flex: 1; height: 80px; border-radius: 10px; display: flex; align-items: flex-end; padding: 6px; }
  .n { font-family: var(--font-mono); font-size: 9px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:var(--slate-50);  border:1px solid var(--slate-200)"><span class="n" style="color:var(--slate-500)">50</span></div>
    <div class="sw" style="background:var(--slate-100)"><span class="n" style="color:var(--slate-500)">100</span></div>
    <div class="sw" style="background:var(--slate-200)"><span class="n" style="color:var(--slate-600)">200</span></div>
    <div class="sw" style="background:var(--slate-300)"><span class="n" style="color:var(--slate-700)">300</span></div>
    <div class="sw" style="background:var(--slate-400)"><span class="n" style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--slate-500)"><span class="n" style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--slate-700)"><span class="n" style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--slate-900)"><span class="n" style="color:#fff">900</span></div>
  </div>
</body>
</html>
