<!-- @dsCard group="Colors" viewport="700x150" name="Shell & surfaces" subtitle="Dark frame holds light work surfaces. White cards float on top." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); }
  .wrap { display: flex; gap: 10px; padding: 20px; }
  .sw { flex: 1; height: 96px; border-radius: 14px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; border: 1px solid rgba(0,0,0,.06); }
  .name { font-size: 11px; font-weight: 800; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: .65; }
  .light .name, .light .hex { color: var(--slate-700); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:var(--shell-900); color:#fff"><span class="name">shell-900</span><span class="hex">#111111</span></div>
    <div class="sw" style="background:var(--shell-800); color:#fff"><span class="name">sidebar-800</span><span class="hex">#1A1C1E</span></div>
    <div class="sw light" style="background:var(--surface-app)"><span class="name">work · app</span><span class="hex">#E9E9E9</span></div>
    <div class="sw light" style="background:var(--surface-app-cool)"><span class="name">work · pro</span><span class="hex">#F8FAFC</span></div>
    <div class="sw light" style="background:var(--surface-card); box-shadow:var(--shadow-card)"><span class="name">card</span><span class="hex">#FFFFFF</span></div>
  </div>
</body>
</html>
