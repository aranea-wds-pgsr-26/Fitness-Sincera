<!-- @dsCard group="Type" viewport="700x250" name="Display & headings" subtitle="Archivo Black (uppercase) is the athletic display voice. Anton powers poster headlines; Inter stays on body." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 22px; }
  .row { display: flex; align-items: baseline; gap: 14px; }
  .row + .row { margin-top: 14px; }
  .row span:last-child { white-space: nowrap; line-height: 1.05; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--slate-400); width: 138px; flex-shrink: 0; line-height: 1.3; }
</style>
</head>
<body>
  <div class="row">
    <span class="meta">display · Archivo 900 · upper</span>
    <span class="fs-display" style="font-size:44px; color:var(--slate-900)">Visão Geral</span>
  </div>
  <div class="row">
    <span class="meta">poster · Anton · upper</span>
    <span class="fs-poster" style="font-size:34px; color:var(--slate-900)">Leg Day Explosivo</span>
  </div>
  <div class="row">
    <span class="meta">h3 · card title · Archivo 700</span>
    <span style="font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--slate-800)">Próxima Atividade</span>
  </div>
  <div class="row">
    <span class="meta">body · Inter 400</span>
    <span style="font-size:15px; color:var(--slate-600)">Coma 3 ovos mexidos com aveia.</span>
  </div>
</body>
</html>
