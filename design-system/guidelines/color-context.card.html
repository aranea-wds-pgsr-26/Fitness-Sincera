<!-- @dsCard group="Colors" viewport="700x150" name="Context accents" subtitle="Purple = Treino · Green = Nutrição. Colour-codes the whole app by section." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px; }
  .ctx { border-radius: 16px; padding: 14px; color: #fff; display: flex; align-items: center; justify-content: space-between; }
  .lab { font-weight: 900; text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
  .sub { font-size: 10px; opacity: .85; font-weight: 600; }
  .dots span { display: inline-block; width: 18px; height: 18px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: .85; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ctx" style="background:var(--purple-500)">
      <div><div class="lab">Treino</div><div class="sub">Personal · força</div><div class="hex">#7C69EF</div></div>
      <div class="dots"><span style="background:var(--purple-300)"></span><span style="background:var(--purple-400)"></span><span style="background:var(--purple-700)"></span></div>
    </div>
    <div class="ctx" style="background:var(--green-400)">
      <div><div class="lab">Nutrição</div><div class="sub">Dieta · saúde</div><div class="hex">#10B981</div></div>
      <div class="dots"><span style="background:var(--green-300)"></span><span style="background:var(--green-500)"></span><span style="background:var(--green-700)"></span></div>
    </div>
  </div>
</body>
</html>
