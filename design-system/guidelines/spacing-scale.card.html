<!-- @dsCard group="Spacing" viewport="700x130" name="Spacing scale" subtitle="4px base unit. Cards pad 16–24; sections gap 24–32." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-body); padding: 22px; }
  .wrap { display: flex; gap: 16px; align-items: flex-end; }
  .u { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--lime-400); border-radius: 4px; width: 22px; }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--slate-500); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="u"><div class="bar" style="height:8px"></div><span class="n">2 · 8</span></div>
    <div class="u"><div class="bar" style="height:12px"></div><span class="n">3 · 12</span></div>
    <div class="u"><div class="bar" style="height:16px"></div><span class="n">4 · 16</span></div>
    <div class="u"><div class="bar" style="height:24px"></div><span class="n">6 · 24</span></div>
    <div class="u"><div class="bar" style="height:32px"></div><span class="n">8 · 32</span></div>
    <div class="u"><div class="bar" style="height:48px"></div><span class="n">12 · 48</span></div>
  </div>
</body>
</html>
