<!-- @dsCard group="Nutricionista" viewport="1280x800" name="Painel do Nutricionista" subtitle="Dashboard de clientes + editor de planos estilo Notion (editável por IA)." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Sincera - Nutricionista</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--shell-900); }
  #app { height: 100vh; }
  .work-scroll::-webkit-scrollbar { width: 8px; }
  .work-scroll::-webkit-scrollbar-thumb { background: var(--slate-200); border-radius: 8px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Notion-style hover reveals - only when a real pointer/hover is available.
     Touch devices always show the controls (no hover state to reveal them). */
  .item-row .item-macros, .item-row .item-del { opacity: 1; transition: opacity .15s; }
  .item-row:hover { background: rgba(0,0,0,.03) !important; }
  @media (hover: hover) and (pointer: fine) {
    .item-row .item-macros, .item-row .item-del { opacity: 0; }
    .item-row:hover .item-macros, .item-row:hover .item-del, .item-row:focus-within .item-macros { opacity: 1; }
  }

  /* ---- Mobile: sidebar -> bottom tab bar (<=860px) ---- */
  @media (max-width: 860px) {
    .fs-sidebar {
      width: 100% !important; height: auto !important; flex-direction: row !important;
      position: fixed !important; left: 0; right: 0; bottom: 0; top: auto;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom)) !important;
      z-index: 40; box-shadow: 0 -6px 24px rgba(0,0,0,.35);
    }
    .fs-sidebar .fs-side-extra { display: none !important; }
    .fs-sidebar nav {
      flex-direction: row !important; gap: 2px !important; flex: none !important;
      width: 100%; overflow-x: auto !important; justify-content: space-between !important;
    }
    .fs-sidebar nav button {
      padding: 10px 8px !important; font-size: 11px !important; white-space: nowrap;
      min-height: 44px; flex-shrink: 0;
    }
    .fs-main-scroll { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)) !important; }
    .fs-stats-grid, .fs-widgets-grid { grid-template-columns: 1fr !important; }
  }

  input:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--ring-focus); outline-offset: 2px;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="lucide-react-shim.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="nutri-shell.jsx"></script>
<script type="text/babel" src="screen-dashboard.jsx"></script>
<script type="text/babel" src="plano-editor.jsx"></script>
<script type="text/babel">
  const { useState } = React;

  function App() {
    const [view, setView] = useState("dashboard"); // dashboard | editor
    const [nav, setNav] = useState("dashboard");

    const openPlan = () => { setView("editor"); setNav("planos"); };
    const back = () => { setView("dashboard"); setNav("dashboard"); };

    return (
      <window.NutriShell active={nav} onNav={(k) => { setNav(k); setView(k === "planos" ? "editor" : "dashboard"); }}>
        {view === "editor"
          ? <window.PlanoEditor plan={window.NUTRI.plan} request={window.NUTRI.studentRequest} onBack={back} />
          : <window.NutriDashboard data={window.NUTRI} onOpenPlan={openPlan} />}
      </window.NutriShell>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
