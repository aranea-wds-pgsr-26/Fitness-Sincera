<!-- @dsCard group="Aluno (Cliente)" viewport="1280x800" name="App do Aluno" subtitle="Routine-first home + Apple-Watch meal scroll with AI suggestions." -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness Sincera - Aluno</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--shell-900); }
  #app { height: 100vh; }
  .work-scroll::-webkit-scrollbar { width: 8px; }
  .work-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 8px; }
  .wheel-scroll { scrollbar-width: none; }
  .wheel-scroll::-webkit-scrollbar { display: none; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fab { position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); right: 28px; z-index: 50; width: 60px; height: 60px; border-radius: 999px; background: var(--lime-400); border: 4px solid var(--shell-900); box-shadow: var(--shadow-xl); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .3s var(--ease-out); }
  .fab:hover { transform: scale(1.1); }
  .toast { position: fixed; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 60; background: var(--lime-400); color: #000; padding: 14px 22px; border-radius: 16px; box-shadow: var(--shadow-xl); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- Mobile: sidebar -> bottom tab bar (<=860px) ---- */
  @media (max-width: 860px) {
    .fs-sidebar {
      width: 100% !important; height: auto !important; flex-direction: row !important;
      position: fixed !important; left: 0; right: 0; bottom: 0; top: auto;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom)) !important;
      z-index: 40; box-shadow: 0 -6px 24px rgba(0,0,0,.35);
    }
    .fs-sidebar .fs-side-extra { display: none !important; }
    .fs-sidebar nav {
      flex-direction: row !important; gap: 2px !important; flex: none !important;
      width: 100%; overflow-x: auto !important; justify-content: space-between !important;
    }
    .fs-sidebar nav button {
      padding: 10px 8px !important; font-size: 11px !important; white-space: nowrap;
      min-height: 44px; flex-shrink: 0;
    }
    .fs-main-scroll { padding: 20px 16px calc(96px + env(safe-area-inset-bottom)) !important; }
    .fab { bottom: calc(84px + env(safe-area-inset-bottom)) !important; right: 18px; }
    .toast { bottom: calc(84px + env(safe-area-inset-bottom)) !important; }
    .fs-dash-grid { grid-template-columns: 1fr !important; }
    .fs-dash-col { grid-column: 1 / -1 !important; }
  }

  /* Restore a visible keyboard focus ring on inputs/buttons that reset
     outline:none inline for their default (mouse) appearance. */
  input:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--ring-focus); outline-offset: 2px;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.js"></script>
<script src="lucide-react-shim.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="app-shell.jsx"></script>
<script type="text/babel" src="screen-dashboard.jsx"></script>
<script type="text/babel" src="screen-nutricao.jsx"></script>
<script type="text/babel">
  const { useState } = React;
  const LF = window.LucideReact;

  function App() {
    const [screen, setScreen] = useState("dashboard");
    const [toast, setToast] = useState(false);
    const { user, meals, goals } = window.ALUNO;

    const camera = () => {
      setToast(true);
      setTimeout(() => setToast(false), 2600);
    };

    return (
      <>
        <window.AppShell active={screen} onNav={setScreen}>
          {screen === "nutricao"
            ? <window.NutricaoScreen user={user} meals={meals} />
            : <window.AlunoDashboard user={user} meals={meals} goals={goals} />}
        </window.AppShell>

        <button className="fab" onClick={camera} title="Identificar refeição com IA" aria-label="Identificar refeição com IA" style={{ border: "none" }}>
          <LF.Camera size={24} color="#000" strokeWidth={3} />
        </button>
        <div className={"toast" + (toast ? " show" : "")} role="status" aria-live="polite">
          <LF.Sparkles size={16} /> Refeição identificada: Frango Grelhado · 350 kcal
        </div>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
